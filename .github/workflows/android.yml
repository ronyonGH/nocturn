name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Auto-Configure Vite and React
      run: |
        npm init -y
        npm install vite @vitejs/plugin-react react react-dom --save
        # Added @capacitor/browser here to resolve your app.jsx import!
        npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/browser --save
        
        # Create standard Vite config file
        echo "import { defineConfig } from 'vite'; import react from '@vitejs/plugin-react'; export default defineConfig({ plugins: [react()] });" > vite.config.js
        
        # Update index.html to read the JSX file correctly
        echo '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nocturn</title></head><body><div id="root"></div><script type="module" src="/app.jsx"></script></body></html>' > index.html

    - name: Compile JSX to Web Assets
      run: |
        npx vite build

    - name: Initialize Android Native Project
      run: |
        npx cap add android

    - name: Synchronize Assets
      run: |
        npx cap sync android

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
